<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搜尋演算法小島 by alam</title>
<style>
:root{
  --ink:#3f3a56; --ink2:#6b6585; --card:#fffaf3; --line:#eadfd0;
  --pink:#f9c3d2; --mint:#bfe9d6; --butter:#fbe6a8; --sky:#bcd8fb; --lav:#d6c8f6;
  --accent:#8f7fd6; --ok:#6bbf9a; --warn:#e9a77f;
  --sky1:#d4dcf7; --sky2:#f3dff0; --sky3:#fdebd8;
  --shadow:0 8px 28px rgba(110,90,150,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.6;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%,var(--sky3) 100%);
  -webkit-tap-highlight-color:transparent;
}
body.calm{--sky1:#e3e8f6; --sky2:#efe6f0; --sky3:#f6eee4; --shadow:0 4px 14px rgba(110,90,150,.12)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#stage canvas.hover{cursor:pointer}
body.calm #stage canvas{filter:saturate(.72) contrast(.94)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #7a6ad0;outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5}
#titleCard{left:16px;top:16px;background:rgba(255,250,243,.92);border-radius:20px;padding:10px 18px 10px 14px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
#titleCard .logo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#fbd9e4 40%,#c9b9f3 100%);flex:none;position:relative}
#titleCard .logo::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:8px;margin-top:-4px;border-radius:50%;border:3px solid #f6d58f;transform:rotate(-18deg)}
#titleCard h1{margin:0;font-size:20px;line-height:1.25;letter-spacing:.02em}
#titleCard .sub{font-size:13px;color:var(--ink2)}
.by{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:999px;background:var(--lav);font-size:13px;font-weight:600;vertical-align:middle}
#tools{right:16px;top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;transition:right .3s}
.chip{border:0;background:rgba(255,250,243,.94);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;font-size:15px;min-height:42px}
.chip[aria-pressed="true"]{background:var(--lav)}
.chip:hover{background:#fff}
body:not(.calm) .chip{transition:background .2s}
#starCount{cursor:default}
#hint{left:50%;bottom:88px;transform:translateX(-50%);background:rgba(255,250,243,.88);padding:6px 16px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;pointer-events:none}
#nav{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,250,243,.92);padding:8px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
#nav button{border:0;border-radius:999px;padding:8px 14px;min-height:42px;background:transparent;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#nav button .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--c)}
#nav button:hover{background:rgba(143,127,214,.12)}
#nav button[aria-current="true"]{background:var(--c)}
#nav button .done{font-size:12px}

/* ---------- island labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:rgba(255,250,243,.94);border-radius:999px;padding:4px 12px 4px 5px;
  display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(110,90,150,.2);white-space:nowrap;will-change:transform}
.lab .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:13px}
.lab:hover,.lab.on{background:#fff}
.lab.star::after{content:"★";color:#e5b34d;margin-left:2px}
@media (max-width:700px){.lab .t{display:none}.lab{padding:4px}}

/* ---------- panel ---------- */
#panel{position:fixed;z-index:6;top:76px;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));
  background:var(--card);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 24px));opacity:0;visibility:hidden}
body:not(.calm) #panel{transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .4s,visibility 0s .5s}
#panel.open{transform:none;opacity:1;visibility:visible}
body:not(.calm) #panel.open{transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .4s,visibility 0s}
.ph{padding:16px 18px 12px;background:var(--c,var(--pink));display:flex;gap:12px;align-items:center}
.ph .big{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.ph h2{margin:0;font-size:19px;line-height:1.3}
.ph p{margin:0;font-size:13.5px;opacity:.85}
.ph .x{margin-left:auto;border:0;background:rgba(255,255,255,.6);width:38px;height:38px;border-radius:50%;font-size:18px;flex:none}
.pb{padding:14px 18px 22px;overflow:auto;flex:1;scroll-behavior:smooth}
.pb h3{margin:18px 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.pb h3:first-child{margin-top:2px}
.pb p{margin:6px 0}
.pb ul{margin:6px 0;padding-left:1.2em}
.pb li{margin:3px 0}
.tag{display:inline-block;padding:1px 9px;border-radius:8px;background:var(--c,var(--lav));font-size:13px;font-weight:600}
.note{background:#fff;border:1.5px dashed var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:15px}
.act{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:14px;padding:9px 16px;min-height:42px;background:var(--c,var(--lav));font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:#f2ece3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.seg{display:flex;gap:6px;background:#f2ece3;border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 6px;font-size:14.5px;font-weight:600;min-height:40px}
.seg button[aria-selected="true"]{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.msg{min-height:3.2em;border-radius:14px;background:#f7f2ea;padding:9px 13px;margin:10px 0;font-size:15px}
.msg.good{background:#e3f5ec}.msg.try{background:#fdeede}
.small{font-size:13.5px;color:var(--ink2)}
.cells{display:grid;gap:8px}
.cell{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:52px;padding:4px;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.cell small{font-size:11.5px;font-weight:500;color:var(--ink2)}
.cell.cur{border-color:#8f7fd6;background:#efeafc}
.cell.hit{border-color:var(--ok);background:#dff4e9}
.cell.miss{background:#f4efe8;color:#9a93ad}
.cell.out{opacity:.35}
.cell.mid{border-color:#e0a24a;background:#fff3d9}
.card{aspect-ratio:3/4;border-radius:14px;border:2px solid #e7d3dc;background:repeating-linear-gradient(45deg,#fbe3ec,#fbe3ec 8px,#fdeef3 8px,#fdeef3 16px);font-size:20px;font-weight:700;display:grid;place-items:center;padding:0;color:#c47b94}
.card.up{background:#fff;color:#d2607f;border-color:#f0cbd8}
.card.up.tgt{border-color:var(--ok);background:#e6f6ee}
.card:disabled{cursor:default}
.target{display:inline-flex;align-items:center;gap:8px;background:#fff3d9;border-radius:12px;padding:3px 12px;font-weight:700}
.bar{height:16px;border-radius:99px;background:#efe8dd;position:relative;overflow:hidden;margin:8px 0}
.bar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#b9e6d2,#bcd8fb);border-radius:99px}
body:not(.calm) .bar i{transition:left .4s,right .4s}
input[type=number]{font:inherit;width:96px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:42px;color:var(--ink)}
table.cmp{border-collapse:collapse;width:100%;font-size:14.5px}
table.cmp td,table.cmp th{border:1px solid var(--line);padding:5px 8px;text-align:center}
table.cmp th{background:#f7f0e6}
.fin{background:linear-gradient(135deg,#fff3d9,#fbe3ec);border-radius:18px;padding:12px 14px;margin-top:12px;font-weight:600;text-align:center}

/* ---------- overlay ---------- */
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(228,222,246,.72);backdrop-filter:blur(6px)}
#intro .box{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:28px 26px;max-width:470px;text-align:center}
#intro h2{margin:6px 0 4px;font-size:26px;line-height:1.3}
#intro p{margin:8px 0;color:var(--ink2)}
#intro .btns{justify-content:center;margin-top:18px}
#intro .btn{padding:12px 20px;font-size:16px}
#intro .btn.main{background:var(--pink)}
#intro .emoji{font-size:44px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:15;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:14.5px;opacity:0;pointer-events:none;max-width:calc(100vw - 32px)}
body:not(.calm) #toast{transition:opacity .4s}
#toast.show{opacity:.92}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


.sidrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;font-weight:600}
.sidrow input{font:inherit;width:140px;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:center;min-height:44px}
body.teacher-mode{overflow:auto;background:var(--card)}
html:has(body.teacher-mode){overflow:auto}
#tch{max-width:1100px;margin:0 auto;padding:22px 16px 40px;position:relative;z-index:1}
#tch h1{margin:0;font-size:24px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.tbar input{font:inherit;padding:9px 12px;border-radius:12px;border:2px solid var(--line);min-height:42px;width:180px;background:#fff;color:var(--ink)}
.sumrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sumrow .chip{background:#fff;box-shadow:none;border:1.5px solid var(--line)}
.twrap{overflow-x:auto;background:#fff;border-radius:16px;border:1.5px solid var(--line)}
#ttb{min-width:760px}
#ttb td small{color:var(--ink2);font-size:12px}
#ttb td.ok{background:#e3f5ec;font-weight:700}
#ttb td.now{background:#fff3d9}
#ttb td.part{background:#f7f2ea}
#ttb td.none{color:#b4adc4}
.dotg,.doty,.dotr{font-size:13px;font-weight:600;padding:1px 8px;border-radius:99px}
.dotg{background:#d6f0e2}.doty{background:#fdeccb}.dotr{background:#eee8e0;color:var(--ink2)}
/* ---------- small screens ---------- */
@media (min-width:821px){
  body.panel-open #nav{left:calc((100vw - 452px)/2)}
  body.panel-open #nav button:not([aria-current="true"]) .t{display:none}
}
@media (max-width:820px){
  #titleCard{padding:8px 14px 8px 10px}
  #titleCard h1{font-size:17px} #titleCard .sub{display:none} #titleCard .logo{width:34px;height:34px}
  #tools{top:auto;bottom:76px;right:12px}
  #tools .chip .t{display:none}
  #hint{display:none}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:56vh;border-radius:24px;transform:translateY(calc(100% + 16px))}
  #panel.open{transform:none}
  #nav{bottom:auto;top:70px;left:8px;right:8px;transform:none;justify-content:center;gap:2px;padding:6px}
  #nav button{padding:6px 9px} #nav button .t{display:none}
  body.panel-open #tools{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage" aria-label="3D 小島場景。可拖曳旋轉、滾輪縮放，點小島前往。"></div>
<div id="labels"></div>

<div class="hud" id="titleCard">
  <div class="logo" aria-hidden="true"></div>
  <div>
    <h1>資料在哪兒？<span class="by">by alam</span></h1>
    <div class="sub">搜尋演算法・五座小島探險</div>
  </div>
</div>

<div class="hud" id="tools" role="toolbar" aria-label="設定">
  <button class="chip" id="syncChip" hidden title="點一下可換學號"></button>
  <span class="chip" id="starCount" aria-live="polite">⭐ <b id="starN">0</b>/5</span>
  <button class="chip" id="btnHome" title="回到全景">🪐 <span class="t">全景</span></button>
  <button class="chip" id="btnMusic" aria-pressed="false" title="背景音樂">🎵 <span class="t">音樂</span></button>
  <button class="chip" id="btnCalm" aria-pressed="false" title="低刺激模式：減少動態、降低色彩、關閉音樂">🌙 <span class="t">低刺激模式</span></button>
</div>

<div class="hud" id="hint">🖱 拖曳旋轉　⚲ 滾輪縮放　👆 點小島出發</div>
<nav class="hud" id="nav" aria-label="前往小島"></nav>

<aside id="panel" aria-live="polite" aria-label="小島內容"></aside>
<div id="toast" role="status"></div>

<div id="intro">
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="introT">
    <div class="emoji" aria-hidden="true">🪐</div>
    <h2 id="introT">資料在哪兒？搜尋小島探險</h2>
    <p>五座漂浮的小島，藏著「搜尋演算法」的秘密。<br>點一座島，小旅人就會帶你飛過去！</p>
    <p class="small">畫面動態很輕柔。如果你容易覺得眼睛累，可以選「低刺激模式」。<br>by alam</p>
    <label class="sidrow" id="sidrow" hidden>學號（或座號）<input id="sid" type="text" maxlength="12" autocomplete="off" inputmode="text" placeholder="例如 12"></label>
    <p class="small" id="sidErr" aria-live="polite" style="min-height:1.4em;margin:2px 0 0;color:#b5673f"></p>
    <p class="small" style="margin:0">請輸入學號或座號就好，不用打姓名。老師可以看到你的進度。</p>
    <div class="btns">
      <button class="btn main" id="goMusic">🎵 開始探險（有音樂）</button>
      <button class="btn" id="goQuiet">🔇 安靜開始</button>
      <button class="btn" id="goCalm">🌙 低刺激模式開始</button>
    </div>
  </div>
</div>
